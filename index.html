<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Guía, documentación y seguimiento de un sistema de diseño."><title>DSBook</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><a class="skip" href="#matrix">Saltar al contenido</a>
<div class="mobile-bar"><button id="menu-button" aria-expanded="false" aria-controls="sidebar">Menú</button><span id="mobile-title">DSBook</span></div>
<div class="shell" id="shell">
<aside class="sidebar" id="sidebar" aria-label="Navegación y filtros">
<div class="blk blk-brand"><button class="brand-btn" id="collapse-btn" type="button" aria-expanded="true" aria-controls="sidebar" aria-label="DSBook: comprimir barra lateral" title="Comprimir barra lateral"><span class="mark">DSB</span></button><p class="project-name" id="project-title">DSimoles</p></div>
<div class="blk blk-progress">
<div class="prog-head"><span class="field-title" title="Avance: listas (R) sobre las subsecciones aplicables, es decir, las que no están en N. Complejidad: subsecciones aplicables sobre el total de la guía.">Avance / Complejidad</span><span class="count" id="result-count" role="status" title="Listas (R) sobre las subsecciones aplicables (R + I + P)">—</span></div>
<progress id="progress" max="100" value="0" aria-label="Avance: secciones listas sobre las aplicables" title="Avance: listas (R) sobre las aplicables (no N)"></progress>
<progress id="scope-progress" max="100" value="0" aria-label="Complejidad: subsecciones aplicables sobre el total" title="Complejidad: aplicables (no N) sobre el total de la guía"></progress>
</div>
<div class="blk blk-content">
<label class="side-search">Buscar<input id="search" type="search" placeholder="Color, foco, componentes…"></label>
<fieldset id="filters"><legend>Estado</legend><button data-status="all" aria-pressed="true">Todos</button><button data-status="R" aria-pressed="false" aria-label="Ready" title="R · Ready">R <span></span></button><button data-status="I" aria-pressed="false" aria-label="In process" title="I · In process">I <span></span></button><button data-status="P" aria-pressed="false" aria-label="Pending" title="P · Pending">P <span></span></button><button data-status="N" aria-pressed="false" aria-label="No aplica" title="N · No aplica">N <span></span></button></fieldset>
<div class="rail-actions">
<button class="icon-btn" id="search-btn" type="button" aria-expanded="false" aria-controls="panel-search" aria-label="Buscar" title="Buscar"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<button class="icon-btn" id="state-btn" type="button" aria-expanded="false" aria-controls="panel-state" aria-label="Filtrar por estado" title="Estado"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<button class="icon-btn" id="sections-btn" type="button" aria-expanded="false" aria-controls="menu-wrap" aria-label="Secciones" title="Secciones: pasa el ratón para ver, haz clic para fijar"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor"/></svg></button>
</div>
<div class="panel" id="panel-search"><label class="menu-search">Buscar<input id="menu-search" type="search" placeholder="Color, foco, componentes…"></label></div>
<div class="panel" id="panel-state" role="group" aria-label="Filtrar por estado"><p class="panel-title">Estado</p>
<label class="check"><input type="checkbox" data-filter="all"> Todos</label>
<label class="check"><input type="checkbox" data-filter="R"> R · Ready <span class="n" data-count="R"></span></label>
<label class="check"><input type="checkbox" data-filter="I"> I · In process <span class="n" data-count="I"></span></label>
<label class="check"><input type="checkbox" data-filter="P"> P · Pending <span class="n" data-count="P"></span></label>
<label class="check"><input type="checkbox" data-filter="N"> N · No aplica <span class="n" data-count="N"></span></label></div>
<div class="menu-wrap" id="menu-wrap"><div class="menu-head"><span class="panel-title">Secciones</span><span class="menu-actions"><button class="text-button" id="expand" type="button" title="Despliega todas las categorías del menú y de la lista">Desplegar todo</button><button class="text-button" id="collapse" type="button" title="Pliega todas las categorías del menú y de la lista">Plegar todo</button></span></div><nav class="menu" id="menu" aria-label="Secciones"></nav></div>
</div>
<div class="side-foot"><p id="save-status" role="status">Leyendo el repositorio…</p><p><a href="README.md">Inicio</a> · <a href="CLAUDE.md">Guía para agentes ↗</a></p></div>
</aside>
<div class="scrim" id="scrim"></div>
<main><h1 class="sr-only" id="page-title">DSBook</h1>
<div id="error" class="notice error" role="alert" hidden></div>
<section id="matrix" aria-label="Matriz del sistema de diseño" tabindex="-1"></section>
<footer><span id="footer-name">DSBook</span><span>La guía orienta. El proyecto registra. Git conserva.</span></footer>
</main></div><noscript>Esta matriz necesita JavaScript. La guía también está disponible en data/guide.json.</noscript></body></html>
